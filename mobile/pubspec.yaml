name: fit_analyzer_mobile
description: 手机上的 fit_analyzer —— 骑行数据聚合分析器（多平台拉取 + 统计分析 + AI）
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # ---- 状态管理 / 路由 ----
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # ---- 数据库 ----
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # ---- 网络 ----
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # ---- ★ FIT/GPX/TCX 解析（纯 Dart，零原生依赖）----
  activity_files: ^0.7.8

  # ---- 图表 ----
  fl_chart: ^0.70.2

  # ---- 文件 / 存储 ----
  file_picker: ^8.1.7
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.4

  # ---- 工具 ----
  intl: ^0.20.2
  crypto: ^3.0.6

  # ---- 可选（后续阶段启用）----
  # flutter_map: ^7.0.2          # 轨迹地图（注意中国测绘合规）
  # latlong2: ^0.9.1
  # workmanager: ^0.5.2          # 后台定时拉取
  # share_plus: ^10.1.4          # 分享摘要图
  # screenshot: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  mockito: ^5.4.5

flutter:
  uses-material-design: true
  # assets:
  #   - assets/
