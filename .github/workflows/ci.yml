name: CI（跨平台验证）

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装 Linux 图形库（PySide6 offscreen 依赖）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libopengl0 libxkbcommon0 libpulse0 libfontconfig1

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 冒烟测试（核心功能 24 项）
        run: python tests/smoke_test.py

      - name: GUI 启动/退出自检（offscreen）
        run: python app.py --quit-test

      - name: GUI 路书图表自检（offscreen，覆盖 QtCharts 新主题）
        run: python tests/gui_route_selftest.py
